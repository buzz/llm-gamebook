[project]
name = "e2e"
version = "0.1.0"
description = "End-to-end tests for LLM Gamebook (Playwright + pytest)"
requires-python = ">=3.13"
dependencies = [
  "playwright>=1.62.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.3.0",
  "pytest-playwright>=0.9.0",
]

[dependency-groups]
dev = [
  "mypy>=1.19.1",
  # Keep in sync with the ruff version in the backend lockfile so both
  # projects lint identically
  "ruff==0.15.0",
]

[tool.uv]
package = false

# Shared rules live in ../ruff.toml; this file only declares overrides.
[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint.extend-per-file-ignores]
# Fixtures report server lifecycle to the console
"conftest.py" = ["T201"]

[tool.mypy]
strict = true
disallow_any_explicit = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
