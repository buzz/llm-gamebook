[project]
name = "llm-gamebook"
version = "0.3.0"
description = "An interactive storytelling framework using LLMs to generate dynamic narratives"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiosqlite>=0.22.1",
  "casefy>=1.1.0",
  "fastapi[standard]>=0.128.1",
  "greenlet>=3.3.1",
  "jinja2>=3.1.6",
  "pydantic>=2.12.5",
  "pydantic-ai-slim[anthropic,openai,google,mistral,xai]>=1.54.0",
  "platformdirs>=4.5.1",
  "pyparsing>=3.3.2",
  "pyyaml>=6.0.3",
  "sqlmodel>=0.0.32",
  "textual>=7.5.0",
  "typer>=0.21.1",
]

[project.urls]
source = "https://github.com/buzz/llm-gamebook"

[dependency-groups]
dev = [
  "mypy>=1.19.1",
  "pytest>=9.0.2",
  "pytest-archon>=0.0.7",
  "pytest-asyncio>=1.3.0",
  "python-semantic-release>=10.5.3",
  "ruff>=0.15.0",
  "types-pyyaml>=6.0.12.20250915",
]

# Shared rules live in ../ruff.toml; this file only declares overrides.
[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint.pylint]
max-args = 6
max-returns = 8

[tool.ruff.lint.extend-per-file-ignores]
# Allow tests to import private names
"tests/**" = ["PLC2701"]

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
disallow_any_explicit = true
# temporarily exclude tui
exclude = ["llm_gamebook/tui"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "module"
asyncio_default_fixture_loop_scope = "module"

[tool.semantic_release]
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""
commit_author = "buzz <buzz@users.noreply.github.com>"
commit_message = "Version {version}"
tag_format = "v{version}"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^\\w+\\(openspec\\):"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "../CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.remote]
type = "github"
ignore_token_for_push = true
